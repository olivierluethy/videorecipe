name: videorecipe
description: "Extract structured recipes from YouTube cooking videos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Networking
  dio: ^5.7.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # YouTube transcript extraction
  youtube_explode_dart: ^3.0.5

  # Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Typography
  google_fonts: ^8.1.0

  # Utilities
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  share_plus: ^13.1.0

  # Subscriptions / paywall
  purchases_flutter: ^10.0.2
  purchases_ui_flutter: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  
  # Optional: separate icon for adaptive Android icons
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  
  # Optional: remove alpha channel for iOS (required by App Store)
  remove_alpha_ios: true